<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f7f2">
<meta name="description" content="BOBMANUEL — Anime Editor, Software Developer and creative digital creator.">
<title>BOBMANUEL | My Links</title>
<link rel="icon" href="../assets/icons/bobmanuel-mark.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#151915;background:#f4f7f2;display:flex;justify-content:center;padding:28px 16px 40px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-20%;z-index:-2;background:radial-gradient(circle at 20% 15%,rgba(116,145,117,.22),transparent 28%),radial-gradient(circle at 80% 75%,rgba(205,182,119,.18),transparent 30%);filter:blur(12px)}
.container{width:min(100%,560px);position:relative}
.card{background:rgba(255,255,255,.76);border:1px solid rgba(20,30,20,.09);box-shadow:0 24px 70px rgba(20,30,20,.12);border-radius:30px;padding:30px 22px 22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);animation:rise .7s ease both}
.profile{text-align:center}
.avatar{width:92px;height:92px;border-radius:50%;object-fit:cover;border:4px solid rgba(255,255,255,.9);box-shadow:0 12px 30px rgba(0,0,0,.14);animation:float 4s ease-in-out infinite}
h1{font-size:1.75rem;letter-spacing:-.04em;margin:16px 0 5px;font-weight:850}
.handle{font-size:.9rem;color:#667066;margin:0 0 10px}
.bio{font-size:.96rem;line-height:1.55;color:#4d574d;max-width:430px;margin:0 auto}
.goal{display:inline-flex;align-items:center;justify-content:center;margin:17px auto 8px;padding:7px 12px;border-radius:999px;background:#151915;color:#fff;font-size:.78rem;font-weight:750;letter-spacing:.02em}
.links{display:grid;gap:12px;margin-top:22px}
.link{position:relative;display:flex;align-items:center;gap:13px;min-height:64px;padding:10px 16px;text-decoration:none;color:#151915;background:#fff;border:1px solid rgba(20,30,20,.09);border-radius:18px;box-shadow:0 8px 22px rgba(20,30,20,.06);transition:transform .22s ease,box-shadow .22s ease,border-color .22s ease}
.link:hover,.link:focus-visible{transform:translateY(-3px);box-shadow:0 14px 28px rgba(20,30,20,.11);border-color:rgba(20,30,20,.18);outline:none}
.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;background:#f1f3ee}
.icon img{width:21px;height:21px;object-fit:contain}
.text{display:flex;flex-direction:column;text-align:left;gap:2px;min-width:0}
.text strong{font-size:.96rem}
.text span{font-size:.78rem;color:#737b73;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrow{margin-left:auto;color:#7a827a;font-size:1.15rem;transition:transform .2s ease}
.link:hover .arrow{transform:translateX(3px)}
.footer{text-align:center;margin-top:22px;color:#7a827a;font-size:.76rem}
.footer a{color:inherit;text-decoration:none}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(max-width:420px){body{padding:14px 10px 26px}.card{padding:24px 14px 18px;border-radius:25px}h1{font-size:1.55rem}.bio{font-size:.9rem}.link{min-height:60px;padding:9px 13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="container">
<section class="card" aria-label="BOBMANUEL links">
<header class="profile">
<img class="avatar" src="../assets/images/bobmanuel-profile.jpg" alt="BOBMANUEL profile photo">
<h1>BOBMANUEL</h1>
<p class="handle">Anime Editor | Software Developer</p>
<p class="bio">Anime edits, VFX, websites and creative digital projects.</p>
<div class="goal">1K → 2K</div>
</header>

<nav class="links" aria-label="Social and portfolio links">
<a class="link" href="https://youtube.com/@scottedits-f2g" target="_blank" rel="noopener noreferrer">
<span class="icon"><img src="https://cdn.simpleicons.org/youtube/FF0000" alt=""></span>
<span class="text"><strong>YouTube</strong><span>Watch my anime edits and videos</span></span>
<span class="arrow" aria-hidden="true">›</span>
</a>
<a class="link" href="https://instagram.com/scott_vfx" target="_blank" rel="noopener noreferrer">
<span class="icon"><img src="https://cdn.simpleicons.org/instagram/E4405F" alt=""></span>
<span class="text"><strong>Instagram</strong><span>Follow my creator work and updates</span></span>
<span class="arrow" aria-hidden="true">›</span>
</a>
<a class="link" href="https://bobmanuel.name.ng" target="_blank" rel="noopener noreferrer">
<span class="icon"><img src="../assets/icons/bobmanuel-mark.svg" alt=""></span>
<span class="text"><strong>Website / Portfolio</strong><span>View my projects, services and work</span></span>
<span class="arrow" aria-hidden="true">›</span>
</a>
</nav>

<footer class="footer">
<p>BOBMANUEL. · Built in Nigeria</p>
</footer>
</section>
</main>
</body>
</html>
