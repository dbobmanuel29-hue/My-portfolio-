<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | BOBMANUEL</title><link rel="icon" href="../assets/icons/bobmanuel-mark.svg"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="admin.css"><script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script></head>
<body><div class="admin-loading" id="adminLoading">Checking administrator access...</div><div class="admin-shell" id="adminShell" hidden><aside class="admin-sidebar"><a href="../index.html" class="admin-brand"><img src="../assets/icons/bobmanuel-mark.svg" alt="" width="34">BOBMANUEL.<small>ADMIN</small></a><nav id="adminNav"><button class="active" data-view="dashboard">Dashboard</button><button data-view="users">Users</button><button data-view="inquiries">Client Inquiries</button><button data-view="projects">Projects</button><button data-view="designs">Designs</button><button data-view="videos">Videos</button><button data-view="settings">Settings</button></nav><button id="adminLogout">Logout</button></aside><main class="admin-main"><header><div><p>Secure console</p><h1 id="viewTitle">Dashboard</h1></div><button class="admin-menu" id="adminMenu" aria-label="Toggle admin menu"><i data-lucide="menu"></i></button></header><section id="adminContent"></section></main></div><dialog id="contentDialog"><form method="dialog" id="contentForm"><h2 id="dialogTitle">Content</h2><input type="hidden" id="contentId"><label>Title<input id="contentTitle" maxlength="120" required></label><label>Description<textarea id="contentDescription" maxlength="2000" required></textarea></label><label>Category<input id="contentCategory" maxlength="80" required></label><label id="imageUrlField">Image / Thumbnail URL<input id="contentImage" type="url" maxlength="1000"><small class="field-help">Optional fallback. You can upload from your phone below instead.</small></label>
<label id="mediaUploadField">Upload Media
<input id="contentFile" type="file" accept="image/*">
<small class="field-help" id="mediaHelp">Choose an image from your phone. It will be uploaded automatically.</small>
<div class="upload-status" id="uploadStatus" hidden></div>
</label>
<label id="videoThumbField" hidden>Upload Video Thumbnail
<input id="contentThumbFile" type="file" accept="image/*">
<small class="field-help">Optional thumbnail for videos.</small>
</label>
<label id="contentUrlField">Live / Video URL<input id="contentUrl" type="url" maxlength="1000"><small class="field-help">Optional fallback or external link.</small></label><label>Technologies / Tools / Tags (comma separated)<input id="contentTech" maxlength="500"></label><label class="check"><input id="contentFeatured" type="checkbox"> Featured</label><div><button value="cancel">Cancel</button><button type="submit" value="default">Save</button></div></form></dialog><dialog id="inquiryDialog"><div class="inquiry-dialog"><button type="button" class="dialog-close" id="inquiryDialogClose" aria-label="Close inquiry details">×</button><h2>Client Inquiry</h2><div id="inquiryDialogBody"></div></div></dialog><script type="module" src="admin.js"></script></body></html>
